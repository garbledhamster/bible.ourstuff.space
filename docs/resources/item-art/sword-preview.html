<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sword preview · Project Bible</title>
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="../../document-reader.css">
<link rel="stylesheet" href="preview.css">
<script type="module" src="sword-preview.js"></script>
</head>
<body>
<main class="document-reader">
<nav aria-label="Document navigation">
<a href="../../read.html?file=/resources/game-bible-guide.md#fighting-game-sword-example">← Fighting-game sword example</a>
</nav>
<article class="chapter-detail-body asset-example">
<h1>Sword preview</h1>
<div class="asset-views">
  <figure>
    <figcaption>Inventory illustration</figcaption>
    <div class="asset-stage"><img src="sword-inventory.webp" alt="Painted sword with a silver-blue blade, curved gold guard, and crimson grip"></div>
  </figure>
  <figure>
    <figcaption>Fight preview · 1×</figcaption>
    <div class="asset-stage asset-stage--fight"><canvas width="64" height="64" role="img" aria-label="Sword equipment layer at 64 by 64 pixels">Sword animation preview</canvas></div>
  </figure>
</div>
<div class="asset-controls">
  <label>Direction
    <select id="direction"><option value="right">Right</option><option value="left">Left</option><option value="up">Up</option><option value="down">Down</option></select>
  </label>
  <label>Move
    <select id="move"><option value="slash">Slash</option><option value="chop">Overhead chop</option></select>
  </label>
  <button id="play" type="button" disabled>Play swing</button>
</div>
<p class="asset-meta" id="status" role="status"></p>
<p class="asset-meta"><a href="sword-spritesheet.png" download>Download PNG sprite sheet</a> · <a href="sword-frames.json" download>Download frame map</a></p>
</article>
</main>
</body>
</html>
