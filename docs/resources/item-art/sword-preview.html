<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sword preview · Project Bible</title>
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="../../document-reader.css">
<style>
  .sword-example { padding: clamp(16px, 4vw, 32px); }
  .sword-example h1 { margin-inline: 0; max-width: none; }
  .sword-views { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; margin-block: 1rem; }
  .sword-views figure { display: grid; grid-row: span 2; grid-template-rows: subgrid; min-width: 0; margin: 0; }
  .sword-views figcaption { font: 700 .875rem/1.3 var(--sans); }
  .sword-stage { display: grid; grid-template: minmax(0, 1fr) / minmax(0, 1fr); place-items: center; height: clamp(120px, 35vw, 242px); padding: 8px; border-radius: 8px; background: #f1edf4; }
  .sword-stage img { width: auto; max-width: 100%; max-height: 100%; object-fit: contain; }
  .sword-stage--fight { background: #3e4b5e; }
  .sword-stage canvas { width: 64px; height: 64px; image-rendering: pixelated; }
  .sword-controls { display: flex; flex-wrap: wrap; align-items: end; gap: 8px 12px; font: 600 .9rem/1.4 var(--sans); }
  .sword-controls label { display: grid; gap: 4px; }
  .sword-controls button, .sword-controls select { min-height: 44px; padding: 0 12px; border: 1px solid #705984; border-radius: 6px; font: inherit; }
  .sword-controls button { background: #503065; color: white; cursor: pointer; }
  .sword-controls button:disabled { opacity: .6; cursor: default; }
  .sword-controls :focus-visible { outline: 3px solid #503065; outline-offset: 2px; }
  .sword-example .sword-meta { margin: 12px 0 0; font: .875rem/1.45 var(--sans); }
</style>
<script type="module" src="sword-preview.js"></script>
</head>
<body>
<main class="document-reader">
<nav aria-label="Document navigation">
<a href="../../read.html?file=/resources/game-bible-guide.md#fighting-game-sword-example">← Fighting-game sword example</a>
</nav>
<article class="chapter-detail-body sword-example">
<h1>Sword preview</h1>
<div class="sword-views">
  <figure>
    <figcaption>Inventory illustration</figcaption>
    <div class="sword-stage"><img src="sword-inventory.webp" alt="Painted sword with a silver-blue blade, curved gold guard, and crimson grip"></div>
  </figure>
  <figure>
    <figcaption>Fight preview · 1×</figcaption>
    <div class="sword-stage sword-stage--fight"><canvas width="64" height="64" role="img" aria-label="Sword equipment layer at 64 by 64 pixels">Sword animation preview</canvas></div>
  </figure>
</div>
<div class="sword-controls">
  <label>Direction
    <select id="direction"><option value="right">Right</option><option value="left">Left</option><option value="up">Up</option><option value="down">Down</option></select>
  </label>
  <label>Move
    <select id="move"><option value="slash">Slash</option><option value="chop">Overhead chop</option></select>
  </label>
  <button id="play" type="button" disabled>Play swing</button>
</div>
<p class="sword-meta" id="status" role="status"></p>
<p class="sword-meta"><a href="sword-spritesheet.png" download>Download PNG sprite sheet</a> · <a href="sword-frames.json" download>Download frame map</a></p>
</article>
</main>
</body>
</html>
